services:
  insights:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ollaya-insights
    environment:
      OLLAYA_BASE_URL: http://host.docker.internal:11435
      PORT: "8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"
    restart: unless-stopped
